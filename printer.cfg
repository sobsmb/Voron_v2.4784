#####################################################################
#  Main entrypoint for Voron V2.4 / 350 with Happy Hare MMU
#####################################################################

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#####################################################################
#  Device IDs
#####################################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_3A0024001351313531383332-if00

[mcu EBBCan]
canbus_uuid: 61feea49af74

#####################################################################
#  Basic Klipper and Printer setup
#####################################################################
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 12000
max_z_velocity: 35
max_z_accel: 350
square_corner_velocity: 5
minimum_cruise_ratio: 0.2

[exclude_object]
[print_stats]
[respond]

[gcode_arcs]
resolution: 0.05

[idle_timeout]
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
      # echo/popup disabled: M118 Idle Timeout reached
      M117 Disable hotend_fan
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
      STATUS_READY
    {% else %}
      SLEEP
    {% endif %}

[force_move]
enable_force_move: True

#####################################################################
#  Includes
#####################################################################

# Happy Hare (left untouched for easier updates)
[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
[include mmu/optional/mmu_menu.cfg]

# Printer config
[include hardware/*.cfg]
[include tuning/*.cfg]
[include features/*.cfg]

# MMU client / addon macros outside the mmu/ tree
[include mmu/optional/client_macros.cfg]
[include macros/includes.cfg]


[include shell_command.cfg]

[probe]
pin: !EBBCan:PB5
x_offset: 0
y_offset: 0
#z_offset: 0.062

speed: 5.0
lift_speed: 10

samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.010
samples_tolerance_retries: 1

activate_gcode:
    # E3D PZ Probe recommended settling delay
    G4 P200

    # Reduce Z motor current while probing
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.4
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.4
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.4
    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT=0.4

    # Keep nozzle temperature low enough for nozzle-contact probing
    {% set PROBE_TEMP = 160 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        # echo/popup disabled: { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        {% if ACTUAL_TEMP > MAX_TEMP %}
            # echo/popup disabled: { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

deactivate_gcode:
    # Restore configured normal Z motor current
    {% set run_current = printer.configfile.config['tmc2209 stepper_z'].run_current | float %}

    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={run_current}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={run_current}
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT={run_current}
    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT={run_current}

# Blue v4 cutter overlay: intentionally after all macro includes
[include blue-v4-cutter.cfg]

