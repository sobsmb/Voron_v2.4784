#####################################################################
# Generate bed mesh profiles at common printing temperatures
#
# Profiles:
#   default       = PLA  at 60°C
#   default_petg  = PETG at 80°C
#   default_abs   = ABS  at 100°C
#
# Default heat-soak times:
#   PLA  = 5 minutes
#   PETG = 10 minutes
#   ABS  = 30 minutes
#
# Run with:
#   GENERATE_ALL_BED_MESHES
#
# Optional overrides:
#   GENERATE_ALL_BED_MESHES PLA_TEMP=60 PETG_TEMP=80 ABS_TEMP=100
#
# Soak times are supplied in minutes:
#   GENERATE_ALL_BED_MESHES PLA_SOAK=5 PETG_SOAK=10 ABS_SOAK=30
#####################################################################

[gcode_macro GENERATE_ALL_BED_MESHES]
description: Generate PLA, PETG, and ABS bed mesh profiles with heat soaking

gcode:
    #################################################################
    # Temperature settings
    #################################################################

    {% set pla_temp = params.PLA_TEMP|default(60)|int %}
    {% set petg_temp = params.PETG_TEMP|default(80)|int %}
    {% set abs_temp = params.ABS_TEMP|default(100)|int %}

    #################################################################
    # Heat-soak settings, in minutes
    #################################################################

    {% set pla_soak = params.PLA_SOAK|default(5)|int %}
    {% set petg_soak = params.PETG_SOAK|default(10)|int %}
    {% set abs_soak = params.ABS_SOAK|default(30)|int %}

    LOG_BLOCK MSG="GENERATE ALL BED MESHES BEGIN"

    RESPOND TYPE=command MSG="Starting multi-temperature bed mesh calibration"
    RESPOND TYPE=command MSG="PLA: {pla_temp}C / {pla_soak} minute soak"
    RESPOND TYPE=command MSG="PETG: {petg_temp}C / {petg_soak} minute soak"
    RESPOND TYPE=command MSG="ABS: {abs_temp}C / {abs_soak} minute soak"

    #################################################################
    # Preparation
    #################################################################

    # Cancel any pending Nevermore shutdown timers
    UPDATE_DELAYED_GCODE ID=Nevermore_off DURATION=0
    UPDATE_DELAYED_GCODE ID=_DISABLE_NEVERMORE DURATION=0

    # Run Nevermore throughout heating, soaking, and meshing
    SET_FAN_SPEED FAN=Nevermore SPEED=1

    # Ensure heaters start from a known state
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

    # Remove any currently active bed mesh
    BED_MESH_CLEAR

    #################################################################
    # Initial home
    #################################################################

    STATUS_HOMING
    M117 Initial Homing
    RESPOND TYPE=command MSG="Performing initial printer home"

    G28
    M400

    #################################################################
    # PLA mesh - default
    #################################################################

    M117 Heating PLA - {pla_temp}C
    RESPOND TYPE=command MSG="Heating bed to {pla_temp}C for PLA mesh"

    M190 S{pla_temp}

    M117 PLA Soak - {pla_soak} min
    RESPOND TYPE=command MSG="PLA temperature reached. Beginning {pla_soak} minute heat soak"

    G4 P{pla_soak * 60000}

    RESPOND TYPE=command MSG="PLA heat soak complete. Running QGL and Z home"

    G32
    M400

    M117 Meshing PLA
    RESPOND TYPE=command MSG="Generating PLA bed mesh profile: default"

    BED_MESH_CALIBRATE
    M400

    BED_MESH_PROFILE SAVE=default

    RESPOND TYPE=command MSG="PLA mesh complete: default"

    #################################################################
    # PETG mesh - default_petg
    #################################################################

    M117 Heating PETG - {petg_temp}C
    RESPOND TYPE=command MSG="Heating bed to {petg_temp}C for PETG mesh"

    M190 S{petg_temp}

    M117 PETG Soak - {petg_soak} min
    RESPOND TYPE=command MSG="PETG temperature reached. Beginning {petg_soak} minute heat soak"

    G4 P{petg_soak * 60000}

    RESPOND TYPE=command MSG="PETG heat soak complete. Running QGL and Z home"

    G32
    M400

    M117 Meshing PETG
    RESPOND TYPE=command MSG="Generating PETG bed mesh profile: default_petg"

    BED_MESH_CALIBRATE
    M400

    BED_MESH_PROFILE SAVE=default_petg

    RESPOND TYPE=command MSG="PETG mesh complete: default_petg"

    #################################################################
    # ABS mesh - default_abs
    #################################################################

    M117 Heating ABS - {abs_temp}C
    RESPOND TYPE=command MSG="Heating bed to {abs_temp}C for ABS mesh"

    M190 S{abs_temp}

    M117 ABS Soak - {abs_soak} min
    RESPOND TYPE=command MSG="ABS temperature reached. Beginning {abs_soak} minute heat soak"

    G4 P{abs_soak * 60000}

    RESPOND TYPE=command MSG="ABS heat soak complete. Running QGL and Z home"

    G32
    M400

    M117 Meshing ABS
    RESPOND TYPE=command MSG="Generating ABS bed mesh profile: default_abs"

    BED_MESH_CALIBRATE
    M400

    BED_MESH_PROFILE SAVE=default_abs

    RESPOND TYPE=command MSG="ABS mesh complete: default_abs"

    #################################################################
    # Finish
    #################################################################

    M117 Meshes Complete
    RESPOND TYPE=command MSG="All three bed mesh profiles are complete"
    RESPOND TYPE=command MSG="Profiles created: default, default_petg, default_abs"
    RESPOND TYPE=command MSG="Turning off the bed and Nevermore"
    RESPOND TYPE=command MSG="Saving configuration and restarting Klipper"

    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

    SET_FAN_SPEED FAN=Nevermore SPEED=0

    M400

    SAVE_CONFIG