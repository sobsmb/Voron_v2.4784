[gcode_macro BLUE_PURGE]
description: 2-row front nozzle-aware purge
gcode:
    # Read the currently configured nozzle diameter from Klipper
    {% set nozzle = printer.configfile.settings.extruder.nozzle_diameter|float %}

    # Purge dimensions
    {% set start_x = 25.0 %}
    {% set end_x = 325.0 %}
    {% set purge_y = 1.0 %}
    {% set line_length = end_x - start_x %}

    # Scale line geometry with nozzle size
    {% set line_width = nozzle * 1.5 %}
    {% set line_height = nozzle * 0.75 %}
    {% set spacing = nozzle * 1.5 %}

    # 1.75mm filament cross-sectional area
    {% set filament_area = 2.405 %}

    # Slightly over-extrude because this is a purge, not a normal printed line
    {% set flow_multiplier = 1.25 %}

    # Calculate extrusion required for each 300mm purge row
    {% set purge_e = (line_length * line_width * line_height / filament_area) * flow_multiplier %}

    # Initial extrusion to get the nozzle flowing
    {% set initial_e = 5.0 * (nozzle / 0.4) %}

    SAVE_GCODE_STATE NAME=BLUE_PURGE_STATE

    G90
    M83

    # Move to front-left purge area
    G1 Z5 F3000
    G1 X{start_x} Y{purge_y} F12000
    G1 Z{line_height} F1200

    # Get filament flowing before drawing the purge rows
    G1 E{initial_e} F300

    # Row 1: left to right
    G1 X{end_x} E{purge_e} F900

    # Row 2: right to left, slightly farther in from the front edge
    G1 Y{purge_y + spacing} F3000
    G1 X{start_x} E{purge_e} F900

    # Release nozzle pressure
    G1 E-0.6 F1800

    # Lift away from purge
    G1 Z3 F1200

    RESTORE_GCODE_STATE NAME=BLUE_PURGE_STATE MOVE=0