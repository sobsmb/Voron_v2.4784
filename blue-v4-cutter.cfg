# Blue v4.2 staged cutter overlay. Not installed or included by live Klipper.
# Include AFTER the generated Happy Hare base files when installing.
# Leave the native cutter selected in menuconfig so its gantry servo is generated.

[mmu_parameters]
form_tip_macro: BLUE_MMU_CUT_TIP

[gcode_macro _MMU_SEQUENCE_VARS]
# Native v4 cutter handles current adjustment/restoration; do not stack the v3 boost.
variable_user_pre_unload_extension: ''

[gcode_macro BLUE_MMU_CUT_TIP_VARS]
description: Native cutter metadata exposed to v4.2's Python current/filament handling
# These mirror _MMU_CUT_TIP_VARS; recheck if native blade/current settings change.
variable_blade_pos: 61.9
variable_cutter_before_extruder: False
variable_cut_axis_steppers: 'stepper_x, stepper_y'
variable_cut_stepper_current: 150
gcode:

[gcode_macro BLUE_MMU_CUT_TIP]
description: Lift up to 10mm, run native v4 cutter, then return to original Z
variable_output_park_pos: -1
gcode:
    {% set lift = params.LIFT|default(10)|float %}
    {% set original_z = printer.gcode_move.gcode_position.z|float %}
    {% set available = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set safe_lift = [[lift, available]|min, 0]|max %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("Home XYZ before using Blue's cutter")}
    {% endif %}
    {% if lift < 0 %}
        {action_raise_error("Cutter LIFT must be non-negative")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=BLUE_MMU_CUT_TIP VARIABLE=output_park_pos VALUE=-1
    SAVE_GCODE_STATE NAME=BLUE_MMU_CUT_TIP_STATE
    G91
    {% if safe_lift > 0 %}
        G1 Z{safe_lift} F1200
    {% endif %}
    _MMU_CUT_TIP {rawparams}
    _BLUE_MMU_CUT_TIP_FINISH ORIGINAL_Z={original_z}

[gcode_macro _BLUE_MMU_CUT_TIP_FINISH]
description: Finish after native cutter completes; preserve its reported filament position
gcode:
    {% set original_z = params.ORIGINAL_Z|float %}
    {% set park_pos = printer['gcode_macro _MMU_CUT_TIP'].output_park_pos|float %}
    SET_GCODE_VARIABLE MACRO=BLUE_MMU_CUT_TIP VARIABLE=output_park_pos VALUE={park_pos}
    G90
    G1 Z{original_z} F1200
    M400
    RESTORE_GCODE_STATE NAME=BLUE_MMU_CUT_TIP_STATE
